; ============================================================
;  MM Scribe - 技能 ID 對照表
;
;  格式:
;    [職業名稱]
;    0x技能ID = 顯示名稱
;    [合併群組-職業名稱]
;    合併名稱 = 顯示名稱1, 顯示名稱2, 顯示名稱3
;
;  - 檔案必須放在 MM Scribe.exe 同一資料夾
;  - 修改後重啟程式生效
;  - 以 ; 或 # 開頭的行為註解
;  - 技能 ID 支援 "0x64d5b11d" 或 "64d5b11d" 兩種寫法,大小寫皆可
;  - 找不到對應 ID 的技能會顯示原始 hex ID
; ============================================================

